<body style="text-align:center">

<!--Epoch Timestamp Form-->
    
<h1><img src="./assests/clock_arrow_transparent.png" style="height: 45px; width: 45px;"> Epoch Timestamp</h1>
    

    <div id="epochForm">
    <form>
        <label for="Time" id="lab"><b>Time</b></label><br>
        <input type="datetime-local" id="time" name="Time"><br>
        <button type="button" class="button-green" onclick="getEpochTime()">📋Submit</button>
    </form>
    
    <!-- Result Display -->
